<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1019"><title>Fokus · Workspace</title><link rel="stylesheet" href="./assets/style.css"></head><body><script>if(new URLSearchParams(location.search).get("embed")==="1")document.body.classList.add("embed")</script><main class="shell"><header class="topbar"><a class="brand" href="./index.html"><span class="mark">◈</span>Workspace</a><nav aria-label="Navigation"><a href="./index.html">Start</a><a href="./galerie.html">Galerie</a><a href="./links.html">Kurzlinks</a><a href="./notizen.html">Notizen</a><a href="./fokus.html">Fokus</a></nav></header><section class="module-intro"><div class="eyebrow">Modul 04</div><h1>Fokus</h1><p class="lead">Ein einfacher 25-Minuten-Timer. Läuft direkt in deinem Browser, ohne zusätzliche Dienste.</p></section><section class="panel"><div class="timer" id="time" role="timer" aria-label="Verbleibende Zeit">25:00</div><div class="actions"><button class="btn" id="toggle">Starten</button><button class="btn-secondary" id="reset">Zurücksetzen</button></div><p class="note" id="status" role="status" style="text-align:center">Bereit für eine Fokusphase.</p></section><script>
const duration=25*60*1000,time=document.getElementById("time"),toggle=document.getElementById("toggle"),status=document.getElementById("status");let remaining=duration,deadline=0,running=false,tick=null;
function display(){let s=Math.max(0,Math.ceil(remaining/1000));time.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");document.title=time.textContent+" · Fokus"}
function stop(){running=false;clearInterval(tick);tick=null;toggle.textContent="Fortsetzen"}
function update(){if(!running)return;remaining=Math.max(0,deadline-Date.now());display();if(remaining===0){stop();toggle.textContent="Neu starten";status.textContent="Fokusphase beendet."}}
toggle.onclick=()=>{if(running){update();stop();status.textContent="Pausiert."}else{if(remaining===0)remaining=duration;deadline=Date.now()+remaining;running=true;toggle.textContent="Pause";status.textContent="Fokusphase läuft.";tick=setInterval(update,250);display()}};
document.getElementById("reset").onclick=()=>{stop();remaining=duration;display();toggle.textContent="Starten";status.textContent="Zurückgesetzt."};
document.addEventListener("visibilitychange",update);display();
</script><footer class="footer">Workspace · Statische Webmodule für GitHub Pages und Homarr</footer></main></body></html>
