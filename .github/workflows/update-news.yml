name: Signal RSS aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "21 * * * *"

permissions:
  contents: write

concurrency:
  group: signal-rss-update
  cancel-in-progress: false

jobs:
  update:
    name: Nachrichten sammeln
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google-News-Decoder installieren
        run: python -m pip install "googlenewsdecoder>=0.1.0,<1"

      - name: RSS-Feeds abrufen
        run: python scripts/update_news.py

      - name: Nachrichten veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatische Aktualisierung: Signal-News"
            git push
          fi
